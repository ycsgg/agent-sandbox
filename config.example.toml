[runtime]
backend = "microsandbox"
max_concurrent_sandboxes = 4
max_reserved_memory = "12G"
default_ttl = "30m"
max_ttl = "8h"

[workspace]
roots = []
allow_rw_mount = false
rw_mount_quota = "2G"

[network]
default = "public"
allow_all_mode = false
allow_private_override = false
allow_non_loopback_publish = false
max_custom_rules = 64

[resources]
default_cpus = 2
default_memory = "2G"
default_disk = "16G"
max_cpus = 8
max_memory = "16G"
max_disk = "64G"

[output]
memory_tail = "2M"
max_log_disk = "128M"
max_artifact_total = "2G"

[transfer]
max_files = 100000
max_file_size = "1G"
max_total_size = "8G"

[cache]
max_size = "50G"
