[runtime]
backend = "microsandbox"
max_concurrent_sandboxes = 4
max_reserved_memory = "12G"
default_ttl = "30m"
max_ttl = "8h"

[qemu]
# binary = "/opt/homebrew/bin/qemu-system-aarch64"
# ssh_binary = "/usr/bin/ssh"
# ssh_user = "root"
# ssh_key = "/Users/example/.ssh/qemu_guest"
boot_timeout = "2m"
shutdown_timeout = "10s"

[cuttlefish]
# Combined directory produced by extracting a matching cvd-host_package.tar.gz
# and Android Cuttlefish device-image archive.
# Install the Cuttlefish Linux host packages separately. Offline mode requires
# host tools new enough to support --enable_tap_devices (2025-03 or newer).
# artifacts = "/opt/android/cuttlefish"
boot_timeout = "5m"
shutdown_timeout = "30s"

[proxy]
# Standard HTTP_PROXY/HTTPS_PROXY/ALL_PROXY/NO_PROXY values are inherited by default.
inherit_env = true
# http = "http://127.0.0.1:7890"
# https = "http://127.0.0.1:7890"
# all = "http://127.0.0.1:7890"
no_proxy = []
# Leave disabled for localhost proxies; the guest has a different loopback.
inject_guest = false

[workspace]
roots = []
allow_rw_mount = false
rw_mount_quota = "2G"

[network]
default = "public"
# Required only for an explicit Cuttlefish/QEMU --network all request.
allow_all_mode = false
allow_private_override = false
allow_non_loopback_publish = false
max_custom_rules = 64

[resources]
default_cpus = 2
default_memory = "2G"
default_disk = "16G"
max_cpus = 8
max_memory = "16G"
max_disk = "64G"

[output]
memory_tail = "2M"
max_log_disk = "128M"
max_artifact_total = "2G"

[transfer]
max_files = 100000
max_file_size = "1G"
max_total_size = "8G"

[cache]
max_size = "50G"
